<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký cửa hàng - Vòng Quay May Mắn</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="/">🎡 Vòng Quay <span>May Mắn</span></a>
</header>
<div class="container narrow">
  <div class="card">
    <h1>Đăng ký cửa hàng</h1>
    <p class="muted">Tạo vòng quay may mắn cho quán của bạn trong 2 phút.</p>
    <form id="f">
      <label>Tên cửa hàng / quán</label>
      <input id="shopName" required placeholder="VD: Cà phê Ban Mai">
      <label>Họ tên chủ cửa hàng</label>
      <input id="name" required placeholder="VD: Nguyễn Văn A">
      <label>Số điện thoại</label>
      <input id="phone" placeholder="VD: 0912345678">
      <label>Email (dùng để đăng nhập)</label>
      <input type="email" id="email" required autocomplete="email" placeholder="ban@email.com">
      <label>Mật khẩu (ít nhất 6 ký tự)</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="••••••••">
      <div class="error" id="err"></div>
      <button class="btn full" type="submit">Tạo vòng quay của tôi</button>
    </form>
    <p class="muted" style="margin-top:16px;">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
  </div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const res = await fetch('/api/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      shopName: document.getElementById('shopName').value,
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }),
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error || 'Có lỗi xảy ra.'; return; }
  location.href = '/dashboard.html';
});
</script>
</body>
</html>
