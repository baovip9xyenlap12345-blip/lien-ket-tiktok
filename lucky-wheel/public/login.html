<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Vòng Quay May Mắn</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="/">🎡 Vòng Quay <span>May Mắn</span></a>
</header>
<div class="container narrow">
  <div class="card">
    <h1>Đăng nhập</h1>
    <p class="muted">Dành cho chủ cửa hàng và quản trị viên.</p>
    <form id="f">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="ban@email.com">
      <label>Mật khẩu</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      <div class="error" id="err"></div>
      <button class="btn full" type="submit">Đăng nhập</button>
    </form>
    <p class="muted" style="margin-top:16px;">Chưa có tài khoản? <a href="/register.html">Đăng ký cửa hàng</a></p>
  </div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }),
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error || 'Có lỗi xảy ra.'; return; }
  location.href = data.role === 'admin' ? '/admin.html' : '/dashboard.html';
});
</script>
</body>
</html>
