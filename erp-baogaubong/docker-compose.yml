# Moi truong trien khai that (VPS). Dev local co the dung PostgreSQL cai san.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: erp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U erp"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: erp, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?}" }
    volumes: [miniodata:/data]
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://erp:${DB_PASSWORD}@db:5432/erp
      SESSION_SECRET: ${SESSION_SECRET:?}
    ports: ["3000:3000"]
volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
