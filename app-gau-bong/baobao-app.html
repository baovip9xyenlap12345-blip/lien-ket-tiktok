<title>BảoBảo POS — Quản lý bán hàng</title>
<style>
:root{
  --pri:#0070F4; --pri-d:#0058C7; --pri-bg:#E8F1FE; --on-pri:#fff;
  --grn:#00A93C; --grn-d:#008A31; --grn-bg:#E3F5E9;
  --bg:#F0F2F5; --surface:#FFFFFF; --surface-2:#F6F8FA;
  --ink:#1F2937; --ink-2:#5B6B7F; --ink-3:#93A1B3; --line:#E3E8EF;
  --warn:#B26A00; --warn-bg:#FBF0DC; --crit:#D63A3A; --crit-bg:#FCE9E9;
  --good:#008A31; --good-bg:#E3F5E9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --shadow:0 1px 2px rgba(31,41,55,.06),0 2px 8px rgba(31,41,55,.05);
  --r:8px;
}
@media (prefers-color-scheme: dark){:root{
  --pri:#3D8DF5; --pri-d:#5EA1F7; --pri-bg:#1B3050; --on-pri:#0C1524;
  --grn:#2FBE62; --grn-d:#57CD7F; --grn-bg:#173424;
  --bg:#12161D; --surface:#1C222C; --surface-2:#242C38;
  --ink:#E9EEF5; --ink-2:#A6B2C2; --ink-3:#6E7C8E; --line:#313B49;
  --warn:#E0A93E; --warn-bg:#3A3018; --crit:#E66A6A; --crit-bg:#3D2020;
  --good:#2FBE62; --good-bg:#173424;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --shadow:0 1px 3px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --pri:#3D8DF5; --pri-d:#5EA1F7; --pri-bg:#1B3050; --on-pri:#0C1524;
  --grn:#2FBE62; --grn-d:#57CD7F; --grn-bg:#173424;
  --bg:#12161D; --surface:#1C222C; --surface-2:#242C38;
  --ink:#E9EEF5; --ink-2:#A6B2C2; --ink-3:#6E7C8E; --line:#313B49;
  --warn:#E0A93E; --warn-bg:#3A3018; --crit:#E66A6A; --crit-bg:#3D2020;
  --good:#2FBE62; --good-bg:#173424;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --shadow:0 1px 3px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --pri:#0070F4; --pri-d:#0058C7; --pri-bg:#E8F1FE; --on-pri:#fff;
  --grn:#00A93C; --grn-d:#008A31; --grn-bg:#E3F5E9;
  --bg:#F0F2F5; --surface:#FFFFFF; --surface-2:#F6F8FA;
  --ink:#1F2937; --ink-2:#5B6B7F; --ink-3:#93A1B3; --line:#E3E8EF;
  --warn:#B26A00; --warn-bg:#FBF0DC; --crit:#D63A3A; --crit-bg:#FCE9E9;
  --good:#008A31; --good-bg:#E3F5E9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --shadow:0 1px 2px rgba(31,41,55,.06),0 2px 8px rgba(31,41,55,.05);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
#hdr{position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;display:flex;align-items:center;
  gap:4px;padding:0 10px;height:48px}
#hdr .logo{font-weight:800;font-size:15px;padding:0 8px;white-space:nowrap}
#menu{display:none;flex:1;gap:2px;overflow-x:auto}
#menu button{color:rgba(255,255,255,.85);font-weight:600;padding:0 12px;height:48px;white-space:nowrap;border-bottom:3px solid transparent}
#menu button.on{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.12)}
@media(min-width:900px){#menu{display:flex}}
#hdr .sp{flex:1}
@media(min-width:900px){#hdr .sp{display:none}}
.btn-pos{background:var(--grn);color:#fff;font-weight:800;padding:7px 14px;border-radius:6px;white-space:nowrap}
#hdr .ic{font-size:17px;padding:6px}
#syncDot{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:3px 2px calc(3px + env(safe-area-inset-bottom))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;color:var(--ink-3);font-size:10px;font-weight:600;border-radius:6px}
#tabs button .i{font-size:19px;line-height:1.1}
#tabs button.on{color:var(--pri)}
@media(min-width:900px){#tabs{display:none} #wrap{padding-bottom:20px!important}}
#wrap{padding:12px 12px 78px;max-width:1220px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:12px}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hrow .grow{flex:1;min-width:140px}
.hrow h2{font-size:16px;font-weight:800;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:5px;background:var(--pri);color:var(--on-pri);font-weight:700;
  padding:7px 12px;border-radius:6px;white-space:nowrap;font-size:13px}
.btn.grn{background:var(--grn);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost.on{background:var(--pri-bg);color:var(--pri);border-color:var(--pri)}
.btn.danger{background:var(--crit-bg);color:var(--crit)}
.btn.sm{padding:5px 9px;font-size:12px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.ch-done{background:var(--good-bg);color:var(--good)}
.ch-part{background:var(--warn-bg);color:var(--warn)}
.ch-cancel{background:var(--crit-bg);color:var(--crit)}
.ch-blue{background:var(--pri-bg);color:var(--pri)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);background:var(--surface-2);
  text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl .link{color:var(--pri);font-weight:700;cursor:pointer}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--crit)}
.muted{color:var(--ink-2)}.tiny{color:var(--ink-3);font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:11px 12px}
.kpi .lb{font-size:11.5px;color:var(--ink-2);font-weight:600}
.kpi .v{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.kpi .sub{font-size:11px;color:var(--ink-3)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 7px}
.grid2{display:grid;gap:12px}
@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.thumb{width:38px;height:38px;border-radius:6px;background:var(--surface-2);display:flex;align-items:center;
  justify-content:center;font-size:19px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.subtabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px;overflow-x:auto}
.subtabs button{padding:8px 13px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.subtabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
#ovl{position:fixed;inset:0;background:rgba(15,23,32,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}
#ovl.open{display:flex}
@media(min-width:700px){#ovl{align-items:center}}
#modal{background:var(--surface);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 22px}
@media(min-width:700px){#modal{border-radius:10px}}
#modal h2{font-size:16px;font-weight:800;margin-bottom:12px}
.frm{display:grid;gap:9px}
.frm label{font-size:11.5px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#tt{position:fixed;z-index:95;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;
  padding:6px 9px;border-radius:7px;pointer-events:none;display:none;white-space:pre-line}
svg text{fill:var(--ink-3);font-size:10px}
.bar:hover,.seg:hover{opacity:.82}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#pos{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
#pos.open{display:flex}
#posHdr{background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:7px 10px}
#posHdr input{border:none;border-radius:6px;max-width:340px}
#posTabs{display:flex;gap:4px;overflow-x:auto}
#posTabs button{background:rgba(255,255,255,.15);color:#fff;font-weight:700;padding:6px 12px;border-radius:6px;white-space:nowrap;font-size:12.5px}
#posTabs button.on{background:#fff;color:var(--pri)}
#posBody{flex:1;display:flex;min-height:0}
#posCart{width:44%;min-width:330px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
#posLines{flex:1;overflow:auto}
.pline{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line)}
.pline .nm{flex:1;min-width:0;font-weight:600;font-size:12.5px;line-height:1.25}
.pline input{width:52px;text-align:center;padding:4px}
.pline .pr{width:86px;text-align:right;padding:4px}
.qbtn{width:24px;height:24px;border-radius:5px;background:var(--surface-2);font-weight:800;flex:none}
#posFoot{border-top:1px solid var(--line);padding:10px;display:grid;gap:7px;background:var(--surface)}
#posFoot .rw{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
#posFoot input{max-width:130px;text-align:right}
#posPay{background:var(--grn);color:#fff;font-size:16px;font-weight:800;padding:12px;border-radius:8px;text-align:center}
#posProds{flex:1;overflow:auto;padding:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--pri)}
.pcard .im{height:74px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.pcard .im img{width:100%;height:100%;object-fit:cover}
.pcard .bd{padding:6px 8px}
.pcard .nm{font-size:11.5px;font-weight:600;line-height:1.25;height:29px;overflow:hidden}
.pcard .pr{color:var(--pri);font-weight:800;font-size:12.5px}
@media(max-width:820px){
  #posBody{flex-direction:column}
  #posCart{width:100%;min-width:0;order:2;max-height:55%;border-right:none;border-top:1px solid var(--line)}
  #posProds{order:1}
}
#sheet{position:fixed;inset:0;z-index:55;background:rgba(15,23,32,.5);display:none;align-items:flex-end}
#sheet.open{display:flex}
#sheet .bd{background:var(--surface);width:100%;border-radius:14px 14px 0 0;padding:10px 14px 26px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#sheet .bd button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:11.5px}
#sheet .bd button .i{font-size:22px}
#login{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
#login.open{display:flex}
#login .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  width:100%;max-width:380px;padding:22px}
#login h2{font-size:18px;font-weight:800;text-align:center}
#login .sub{text-align:center;color:var(--ink-2);font-size:12px;margin:4px 0 16px}
@media print{#hdr,#tabs,#pos,#sheet{display:none!important}}
#printArea{display:none}
.pr-c{text-align:center}.pr-line{border-top:1px dashed #000;margin:4px 0}
.pr-t{width:100%;border-collapse:collapse}.pr-t td{padding:2px 0;vertical-align:top;font-size:11px}.pr-t .r{text-align:right}
.pr-r{display:flex;justify-content:space-between;font-size:11px}
@media print{
  body.printing #hdr,body.printing #wrap,body.printing #tabs,body.printing #pos,
  body.printing #ovl,body.printing #sheet,body.printing #login{display:none!important}
  body.printing #printArea{display:block!important;width:72mm;color:#000;background:#fff;font-family:Arial,sans-serif;font-size:11px;line-height:1.35}
  @page{size:80mm auto;margin:3mm}
}
</style>

<div id="hdr">
  <span class="logo">🧸 BảoBảo</span>
  <nav id="menu"></nav>
  <span class="sp"></span>
  <span id="syncDot" title="Trạng thái đồng bộ">⚪</span>
  <button class="ic" id="themeBtn" title="Sáng/tối">🌓</button>
  <button class="ic" onclick="go('settings')" title="Cài đặt">⚙️</button>
  <button class="btn-pos" onclick="POS.open()">🛒 Bán hàng</button>
</div>
<div id="wrap"><div id="view"></div></div>
<nav id="tabs"></nav>
<div id="sheet" onclick="if(event.target.id==='sheet')this.classList.remove('open')"><div class="bd" id="sheetBd"></div></div>

<div id="pos">
  <div id="posHdr">
    <button style="font-size:18px;color:#fff" onclick="POS.close()" title="Đóng">✕</button>
    <input id="posQ" placeholder="🔍 Tìm gấu theo tên, size... (Enter = thêm kết quả đầu)" oninput="POS.renderProds()" autocomplete="off">
    <div id="posTabs"></div>
  </div>
  <div id="posBody">
    <div id="posCart">
      <div style="padding:8px 10px;border-bottom:1px solid var(--line)" class="hrow">
        <input id="posCust" list="posCustDl" placeholder="👤 Khách lẻ (gõ tên để gắn khách)" style="flex:1" onchange="POS.setCust()">
        <datalist id="posCustDl"></datalist>
      </div>
      <div id="posLines"></div>
      <div id="posFoot"></div>
    </div>
    <div id="posProds">
      <div class="hrow" id="posCats"></div>
      <div class="pgrid" id="posGrid"></div>
    </div>
  </div>
</div>

<div id="ovl"><div id="modal"></div></div>
<div id="toast"></div>
<div id="tt"></div>
<div id="printArea"></div>

<div id="login"><div class="box">
  <h2>🧸 BảoBảo POS</h2>
  <div class="sub" id="loginSub">Đăng nhập để vào hệ thống</div>
  <div class="frm">
    <div id="loginApiRow" style="display:none"><label>Địa chỉ máy chủ (link /exec)</label><input id="lg_api" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div><label>Tài khoản</label><input id="lg_u" autocomplete="username"></div>
    <div><label>Mật khẩu</label><input id="lg_p" type="password" autocomplete="current-password"></div>
    <button class="btn" style="justify-content:center" onclick="SYNC.doLogin()">🔓 Đăng nhập</button>
    <div id="lg_err" class="tiny" style="color:var(--crit);text-align:center"></div>
    <button id="lg_local" class="btn ghost sm" style="justify-content:center" onclick="SYNC.useLocal()">Dùng 1 máy (không đồng bộ)</button>
  </div>
</div></div>

const KEY='baobao_pos_v2', OLDKEY='baobao_app_v1';
let DB=null;
function load(){
  try{ DB=JSON.parse(localStorage.getItem(KEY)); }catch(e){ DB=null; }
  if(DB){ return; }
  let old=null; try{ old=JSON.parse(localStorage.getItem(OLDKEY)); }catch(e){}
  DB={ products:SEED_PRODUCTS.map((p,i)=>({...p, code:'SP'+String(i+1).padStart(4,'0'), cost:0})),
    customers:[], suppliers:[], invoices:[], purchases:[], fund:[], salaries:[],
    settings:{name:"Xưởng Gấu Bông Bảo Bảo", phone:"0876.123.333", addr:"Phủ Yên 3, Yên Lập, Vĩnh Tường, Vĩnh Phúc", web:"baogaubong.vn"},
    seq:{hd:0,pn:0,pt:0,pc:0} };
  if(old){
    DB.customers = old.customers||[];
    (old.products||[]).forEach(op=>{ const p=DB.products.find(p=>p.name===op.name&&p.size===op.size);
      if(p){ p.stock=op.stock||0; p.img=op.img||''; p.si=op.si; p.le=op.le; } });
    (old.orders||[]).forEach(o=>{ DB.seq.hd++;
      const total=o.items.reduce((s,i)=>s+i.qty*i.price,0);
      DB.invoices.push({id:o.id, code:DB.seq.hd, date:o.date, cid:o.cid, cname:o.cname,
        items:o.items.map(i=>({...i,cost:0})), discount:0,
        pays:o.status==='tt'?[{date:o.date,amt:total}]:[],
        status:o.status==='huy'?'cancel':'done', note:o.note||''}); });
    (old.expenses||[]).forEach(e=>{ DB.seq.pc++;
      DB.fund.push({id:e.id, code:DB.seq.pc, kind:'chi', date:e.date, group:e.type, desc:e.desc, amount:+e.amount}); });
    DB.salaries = old.salaries||[];
  }
  save();
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('vi-VN');
const fmtd=iso=>{ if(!iso)return''; const[y,m,d]=iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; };
const today=()=>new Date().toISOString().slice(0,10);
const monthLabel=ym=>{const[y,m]=ym.split('-');return `Tháng ${+m}/${y}`;};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2300);}
function openModal(h){$('#modal').innerHTML=h;$('#ovl').classList.add('open');}
function closeModal(){$('#ovl').classList.remove('open');}
$('#ovl').addEventListener('click',e=>{if(e.target.id==='ovl')closeModal();});
const alive=a=>(a||[]).filter(x=>!x.del);
const prod=id=>DB.products.find(p=>p.id===id);
const cust=id=>DB.customers.find(c=>c.id===id);
const supp=id=>DB.suppliers.find(s=>s.id===id);
const invTotal=v=>v.items.reduce((s,i)=>s+i.qty*i.price,0)-(v.discount||0);
const invPaid=v=>(v.pays||[]).reduce((s,p)=>s+p.amt,0);
const invDebt=v=>v.status==='cancel'?0:Math.max(0,invTotal(v)-invPaid(v));
const invCogs=v=>v.items.reduce((s,i)=>s+i.qty*(i.cost||0),0);
const inMonth=(iso,ym)=>(iso||'').slice(0,7)===ym;
const HD=v=>'HD'+String(v.code).padStart(5,'0');
const PN=v=>'PN'+String(v.code).padStart(5,'0');
function invStatus(v){
  if(v.status==='cancel') return ['Đã hủy','ch-cancel'];
  return invDebt(v)<=0?['Hoàn thành','ch-done']:['Còn nợ '+fmt(invDebt(v)),'ch-part'];
}
function monthRevenue(ym){return DB.invoices.filter(v=>v.status!=='cancel'&&inMonth(v.date,ym)).reduce((s,v)=>s+invTotal(v),0);}
function monthCogs(ym){return DB.invoices.filter(v=>v.status!=='cancel'&&inMonth(v.date,ym)).reduce((s,v)=>s+invCogs(v),0);}
function monthChi(ym){return alive(DB.fund).filter(f=>f.kind==='chi'&&inMonth(f.date,ym)).reduce((s,f)=>s+ +f.amount,0);}
function monthSalary(ym){return alive(DB.salaries).filter(x=>x.month===ym).reduce((s,x)=>s+ +x.amount,0);}
function monthPurchase(ym){return DB.purchases.filter(p=>inMonth(p.date,ym)).reduce((s,p)=>s+p.items.reduce((a,i)=>a+i.qty*i.cost,0),0);}
async function saveFile(name,text,mime){
  if(window.claude&&window.claude.downloads){ try{ await window.claude.downloads.save({filename:name,data:text}); toast('Đã lưu '+name); return; }catch(e){} }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:(mime||'text/plain')+';charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
}

function qrURL(amt,info){ const st=DB.settings;
  if(!st.bank||!st.acc) return '';
  return `https://img.vietqr.io/image/${st.bank}-${st.acc}-qr_only.png?amount=${Math.round(amt)}&addInfo=${encodeURIComponent(info)}`+(st.accName?`&accountName=${encodeURIComponent(st.accName)}`:'');
}
function fundRows(){
  const rows=[];
  DB.invoices.forEach(v=>{ if(v.status!=='cancel') (v.pays||[]).forEach(p=>rows.push(
    {date:p.date, kind:'thu', code:HD(v), desc:'Thu tiền '+HD(v)+' — '+(v.cname||'Khách lẻ')+(p.method==='ck'?' · 🏦 CK':' · 💵 TM'), amount:p.amt})); });
  DB.purchases.forEach(p=>{ if(p.paid>0) rows.push({date:p.date, kind:'chi', code:PN(p), desc:'Trả tiền nhập hàng '+PN(p)+(p.sname?' — '+p.sname:''), amount:p.paid}); });
  alive(DB.fund).forEach(f=>rows.push({date:f.date, kind:f.kind, code:(f.kind==='thu'?'PT':'PC')+String(f.code).padStart(4,'0'),
    desc:f.group+(f.desc?' — '+f.desc:''), amount:+f.amount}));
  alive(DB.salaries).filter(x=>x.paid).forEach(x=>rows.push({date:(x.month||'')+'-28', kind:'chi', code:'LG',
    desc:'Lương '+x.name+' ('+monthLabel(x.month)+')', amount:+x.amount}));
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}

function mergeDB(a,b){
  if(!a)return b; if(!b)return a;
  const COLS=['products','customers','suppliers','invoices','purchases','fund','salaries'];
  const o={};
  COLS.forEach(k=>{ const map={};
    (a[k]||[]).forEach(x=>{if(x&&x.id!=null)map[x.id]=x;});
    (b[k]||[]).forEach(x=>{ if(!x||x.id==null)return; const c=map[x.id];
      if(!c||(x.ts||0)>=(c.ts||0)) map[x.id]=x; });
    o[k]=Object.values(map); });
  o.settings=((b.settings&&(b.settings.ts||0))>=((a.settings&&a.settings.ts)||0))?b.settings:a.settings;
  o.seq={}; const sa=a.seq||{},sb=b.seq||{};
  ['hd','pn','pt','pc'].forEach(k=>o.seq[k]=Math.max(sa[k]||0,sb[k]||0));
  return o;
}
const SYNC={
  get api(){return localStorage.getItem('bb_api')||'';},
  set api(v){localStorage.setItem('bb_api',v||'');},
  get token(){return localStorage.getItem('bb_token')||'';},
  get role(){return localStorage.getItem('bb_role')||'';},
  get uname(){return localStorage.getItem('bb_name')||'';},
  get localMode(){return localStorage.getItem('bb_local')==='1';},
  status:'off',
  setSess(t,r,n){localStorage.setItem('bb_token',t);localStorage.setItem('bb_role',r);localStorage.setItem('bb_name',n);},
  async call(action,body){
    const r=await fetch(this.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({action,token:this.token},body||{}))});
    return r.json();
  },
  needLogin(){ return !this.localMode && this.api && !this.token; },
  showLogin(msg){
    $('#login').classList.add('open');
    $('#loginApiRow').style.display=this.api?'none':'block';
    $('#lg_local').style.display=this.api?'none':'';
    if(this.api)$('#lg_api').value=this.api;
    $('#lg_err').textContent=msg||'';
  },
  async doLogin(){
    const api=(($('#lg_api').value||'').trim())||this.api;
    if(!api){ $('#loginApiRow').style.display='block'; $('#lg_err').textContent='Dán link máy chủ /exec vào ô trên (xem Hướng dẫn cài máy chủ trong ⚙️ Cài đặt)'; return; }
    this.api=api;
    $('#lg_err').textContent='Đang kết nối...';
    try{
      const r=await this.call('login',{u:$('#lg_u').value.trim(),p:$('#lg_p').value});
      if(!r.ok){ $('#lg_err').textContent=r.err==='wrong_login'?'Sai tài khoản hoặc mật khẩu':'Lỗi: '+(r.err||'không rõ'); return; }
      this.setSess(r.token,r.role,r.name);
      localStorage.removeItem('bb_local');
      $('#login').classList.remove('open');
      toast(`Xin chào ${r.name} (${ROLES[r.role]||r.role})`);
      await this.pull(true); render(); this.startTimers();
    }catch(e){ $('#lg_err').textContent='Không kết nối được máy chủ — kiểm tra lại link và mạng.'; }
  },
  useLocal(){ localStorage.setItem('bb_local','1'); $('#login').classList.remove('open'); this.status='off'; render(); },
  logout(){ if(this.api&&this.token){
      if(!confirm('Đăng xuất sẽ xóa dữ liệu trên máy này (bản chuẩn vẫn nằm trên máy chủ, đăng nhập lại là kéo về). Tiếp tục?'))return;
      localStorage.removeItem(KEY); }
    ['bb_token','bb_role','bb_name','bb_local'].forEach(k=>localStorage.removeItem(k)); location.reload(); },
  _pushT:null,
  schedulePush(){ if(this.localMode||!this.api||!this.token)return;
    clearTimeout(this._pushT); this._pushT=setTimeout(()=>this.push(),1500); },
  async push(){ if(this.localMode||!this.api||!this.token)return;
    try{ this.status='sync'; renderSyncDot();
      const r=await this.call('push',{db:DB});
      if(r.ok){ DB=mergeDB(DB,r.db); window.DB=DB; localStorage.setItem(KEY,JSON.stringify(DB)); this.status='ok'; }
      else if(r.err==='need_login'){ this.status='err'; this.showLogin('Phiên hết hạn — đăng nhập lại'); }
      else this.status='err';
    }catch(e){ this.status='err'; }
    renderSyncDot();
  },
  async pull(silent){ if(this.localMode||!this.api||!this.token)return;
    try{ this.status='sync'; renderSyncDot();
      const r=await this.call('pull');
      if(r.ok){ const before=JSON.stringify(DB);
        if(r.db){ DB=mergeDB(DB,r.db); window.DB=DB; }
        localStorage.setItem(KEY,JSON.stringify(DB));
        this.status='ok';
        if(JSON.stringify(DB)!==before){ render(); if(!silent)toast('Đã nhận dữ liệu mới từ máy khác'); }
        if(!r.db) this.push();
      } else if(r.err==='need_login'){ this.status='err'; this.showLogin('Phiên hết hạn — đăng nhập lại'); }
      else this.status='err';
    }catch(e){ this.status='err'; }
    renderSyncDot();
  },
  _timer:null,
  startTimers(){ clearInterval(this._timer);
    this._timer=setInterval(()=>this.pull(true),45000);
    window.addEventListener('focus',()=>this.pull(true)); },
  init(){ if(this.needLogin()){ this.showLogin(); return; }
    if(!this.localMode&&this.api&&this.token){ this.pull(true); this.startTimers(); } },
};
function renderSyncDot(){ const el=$('#syncDot'); if(!el)return;
  const map={off:'⚪ 1 máy',ok:'🟢 Đồng bộ',sync:'🔄 ...',err:'🔴 Mất kết nối'};
  el.textContent=(SYNC.localMode||!SYNC.api)?map.off:(map[SYNC.status]||map.off);
}

function ttShow(e,t){const el=$('#tt');el.textContent=t;el.style.display='block';
  el.style.left=Math.min(e.clientX+12,innerWidth-170)+'px';el.style.top=Math.max(e.clientY-40,8)+'px';}
function ttHide(){$('#tt').style.display='none';}
function attachTT(root){root.querySelectorAll('[data-tt]').forEach(el=>{
  el.addEventListener('mousemove',e=>ttShow(e,el.dataset.tt));
  el.addEventListener('mouseleave',ttHide);
  el.addEventListener('click',e=>ttShow(e,el.dataset.tt));});}
function groupBarChart(labels,series,H){
  const W=680;H=H||190;const padL=8,padB=18,padT=8;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const iw=(W-padL)/labels.length, bw=Math.min(16,(iw-8)/series.length);
  let out=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  for(let g=1;g<=3;g++){const y=padT+(H-padB-padT)*(1-g/3);
    out+=`<line x1="${padL}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)"/>`;}
  labels.forEach((lb,i)=>{const cx=padL+iw*i+iw/2;
    series.forEach((s,si)=>{const v=s.values[i],h=Math.round((H-padB-padT)*v/max);
      const x=cx-(bw*series.length+2*(series.length-1))/2+si*(bw+2), y=H-padB-h;
      out+=`<rect class="bar" data-tt="${esc(lb)} — ${esc(s.name)}: ${fmt(v)} đ" x="${x.toFixed(1)}" y="${y}" width="${bw}" height="${Math.max(h,v>0?2:0)}" rx="3" fill="${s.color}"/>`;});
    out+=`<text x="${cx}" y="${H-5}" text-anchor="middle">${esc(lb)}</text>`;});
  return out+'</svg>';
}
function donutChart(parts){
  const total=parts.reduce((s,p)=>s+p.value,0);
  if(!total) return `<div class="muted" style="padding:18px;text-align:center">Chưa có dữ liệu</div>`;
  const R=54,r=34,C=70;let a0=-Math.PI/2,out=`<svg viewBox="0 0 140 140" style="width:148px;height:148px;flex:none" role="img">`;
  parts.filter(p=>p.value>0).forEach(p=>{const f=p.value/total,a1=a0+f*2*Math.PI,L=f>.5?1:0;
    const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
    const xi=C+r*Math.cos(a1),yi=C+r*Math.sin(a1),xj=C+r*Math.cos(a0),yj=C+r*Math.sin(a0);
    out+=`<path class="seg" data-tt="${esc(p.label)}: ${fmt(p.value)} đ (${Math.round(f*100)}%)" d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${L} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${xi.toFixed(1)} ${yi.toFixed(1)} A${r} ${r} 0 ${L} 0 ${xj.toFixed(1)} ${yj.toFixed(1)} Z" fill="${p.color}" stroke="var(--surface)" stroke-width="2"/>`;
    a0=a1;});
  out+='</svg>';
  return `<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">${out}<div style="flex:1;min-width:150px">`+
    parts.map(p=>`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12.5px">
      <span><span style="background:${p.color};display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px"></span>${esc(p.label)}</span>
      <b class="num">${fmt(p.value)}</b></div>`).join('')+`</div></div>`;
}
function hbarChart(rows,unit){
  if(!rows.length) return `<div class="muted" style="padding:18px;text-align:center">Chưa có dữ liệu</div>`;
  const max=Math.max(...rows.map(r=>r.value),1);
  return rows.map(r=>`<div style="margin:7px 0">
    <div style="display:flex;justify-content:space-between;font-size:12.5px">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>
      <b class="num" style="flex:none;margin-left:8px">${fmt(r.value)}${unit||' đ'}${r.sub?` · ${r.sub}`:''}</b></div>
    <div style="background:var(--surface-2);border-radius:4px;height:9px;margin-top:3px">
      <div class="bar" data-tt="${esc(r.label)}: ${fmt(r.value)}${unit||' đ'}" style="width:${Math.max(2,r.value/max*100)}%;height:100%;border-radius:4px;background:var(--s1)"></div></div></div>`).join('');
}

/* ================= POS ================= */
const POS={
  tabs:[], active:0,
  open(){ if(SYNC.role&&!POS_ROLES.includes(SYNC.role)){toast('Tài khoản của bạn không có quyền bán hàng');return;}
    if(!this.tabs.length) this.newTab();
    $('#pos').classList.add('open'); this.renderAll(); setTimeout(()=>$('#posQ').focus(),50); },
  close(){ $('#pos').classList.remove('open'); render(); },
  newTab(){ this.tabs.push({items:[], cid:null, cname:'', discount:0, cash:'', deliver:'', method:'tm'}); this.active=this.tabs.length-1; this.renderAll(); },
  closeTab(i){ this.tabs.splice(i,1); if(!this.tabs.length) this.newTab();
    this.active=Math.min(this.active,this.tabs.length-1); this.renderAll(); },
  cur(){ return this.tabs[this.active]; },
  renderAll(){ this.renderTabs(); this.renderCats(); this.renderProds(); this.renderCart(); },
  renderTabs(){ $('#posTabs').innerHTML=this.tabs.map((t,i)=>
      `<button class="${i===this.active?'on':''}" onclick="POS.active=${i};POS.renderAll()">HĐ ${i+1}${t.items.length?` (${t.items.reduce((s,x)=>s+x.qty,0)})`:''} <span onclick="event.stopPropagation();POS.closeTab(${i})">✕</span></button>`).join('')+
      `<button onclick="POS.newTab()">＋</button>`;
    $('#posCustDl').innerHTML=alive(DB.customers).map(c=>`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`).join('');
    $('#posCust').value=this.cur().cname||''; },
  catSel:'all',
  renderCats(){ const cats=[...new Set(alive(DB.products).map(p=>p.cat))];
    $('#posCats').innerHTML=[`<button class="btn ghost sm ${this.catSel==='all'?'on':''}" onclick="POS.catSel='all';POS.renderProds();POS.renderCats()">Tất cả</button>`]
      .concat(cats.map(c=>`<button class="btn ghost sm ${this.catSel===c?'on':''}" onclick="POS.catSel='${esc(c)}';POS.renderProds();POS.renderCats()">${esc(c)}</button>`)).join(''); },
  renderProds(){ const q=($('#posQ').value||'').toLowerCase();
    const list=alive(DB.products).filter(p=>(this.catSel==='all'||p.cat===this.catSel)&&(!q||(p.name+' '+p.size).toLowerCase().includes(q)));
    $('#posGrid').innerHTML=list.map(p=>`<button class="pcard" onclick="POS.add('${p.id}')">
      <div class="im">${p.img?`<img src="${p.img}">`:'🧸'}</div>
      <div class="bd"><div class="nm">${esc(p.name)} ${esc(p.size)}</div>
      <div class="pr num">${fmt(p.si)}</div>
      <div class="tiny ${p.stock<=0?'neg':''}">${p.stock>0?'Tồn '+p.stock:'☎ Đặt trước'}</div></div></button>`).join(''); },
  add(pid){ const t=this.cur(); const p=prod(pid);
    const it=t.items.find(i=>i.pid===pid);
    if(it) it.qty++; else t.items.push({pid, qty:1, price:p.si, cost:p.cost||0});
    this.renderTabs(); this.renderCart(); },
  qty(idx,d){ const t=this.cur(); t.items[idx].qty=Math.max(1,t.items[idx].qty+d); this.renderTabs(); this.renderCart(); },
  setQty(idx,v){ this.cur().items[idx].qty=Math.max(1,+v||1); this.renderTabs(); this.renderCart(); },
  setPrice(idx,v){ this.cur().items[idx].price=Math.max(0,+v||0); this.renderCart(); },
  rm(idx){ this.cur().items.splice(idx,1); this.renderTabs(); this.renderCart(); },
  setCust(){ const t=this.cur(); t.cname=$('#posCust').value.trim();
    const c=alive(DB.customers).find(c=>c.name===t.cname); t.cid=c?c.id:null; },
  setDisc(v){ this.cur().discount=Math.max(0,+v||0); this.renderCart(); },
  setCash(v){ const t=this.cur(); t.cash=v;
    const sub=t.items.reduce((s,i)=>s+i.qty*i.price,0), total=Math.max(0,sub-(t.discount||0));
    const cash=String(v).trim()===''?total:(+String(v).replace(/\D/g,'')||0);
    const change=cash-total, lb=$('#pf_lb'), val=$('#pf_val');
    if(lb){ lb.textContent=change>=0?'Tiền thừa trả khách':'⚠ KHÁCH CÒN NỢ';
      val.textContent=fmt(Math.abs(change))+' đ';
      val.className='num '+(change>=0?'pos':'neg'); } },
  setDeliver(v){ this.cur().deliver=v; },
  setMethod(v){ this.cur().method=v; this.renderCart(); },
  renderCart(){ const t=this.cur();
    $('#posLines').innerHTML=t.items.length?t.items.map((i,idx)=>{const p=prod(i.pid);
      return `<div class="pline">
        <span class="thumb" style="width:32px;height:32px;font-size:16px">${p&&p.img?`<img src="${p.img}">`:'🧸'}</span>
        <span class="nm">${p?esc(p.name)+' '+esc(p.size):'SP'}<br><span class="tiny num">${fmt(i.price)} × ${i.qty} = <b>${fmt(i.qty*i.price)}</b></span></span>
        <button class="qbtn" onclick="POS.qty(${idx},-1)">−</button>
        <input type="number" value="${i.qty}" min="1" onchange="POS.setQty(${idx},this.value)">
        <button class="qbtn" onclick="POS.qty(${idx},1)">＋</button>
        <input class="pr" type="number" value="${i.price}" step="1000" onchange="POS.setPrice(${idx},this.value)">
        <button class="qbtn" style="color:var(--crit)" onclick="POS.rm(${idx})">✕</button></div>`;}).join('')
    :'<div class="muted" style="padding:26px;text-align:center">Giỏ trống — bấm sản phẩm bên phải để thêm 🧸</div>';
    const sub=t.items.reduce((s,i)=>s+i.qty*i.price,0), total=Math.max(0,sub-(t.discount||0));
    const cash=String(t.cash??'').trim()===''?total:(+String(t.cash).replace(/\D/g,'')||0);
    const change=cash-total;
    $('#posFoot').innerHTML=`
      <div class="rw"><span>Tổng tiền hàng (${t.items.reduce((s,i)=>s+i.qty,0)} con)</span><b class="num">${fmt(sub)}</b></div>
      <div class="rw"><span>Giảm giá</span><input type="number" value="${t.discount||''}" placeholder="0" step="1000" onchange="POS.setDisc(this.value)"></div>
      <div class="rw" style="font-size:17px"><b>KHÁCH PHẢI TRẢ</b><b class="num" style="color:var(--pri)">${fmt(total)} đ</b></div>
      <div class="rw"><span>💰 Khách cọc / thanh toán</span><input id="pf_cash" type="number" value="${t.cash||''}" placeholder="${total} (trả đủ)" step="1000" oninput="POS.setCash(this.value)"></div>
      <div class="rw"><span>Hình thức</span><span style="display:flex;gap:5px">
        <button class="btn sm ${t.method!=='ck'?'':'ghost'}" onclick="POS.setMethod('tm')">💵 Tiền mặt</button>
        <button class="btn sm ${t.method==='ck'?'':'ghost'}" onclick="POS.setMethod('ck')">🏦 Chuyển khoản</button></span></div>
      <div class="rw"><span>📦 Ngày giao hàng</span><input type="date" value="${t.deliver||''}" onchange="POS.setDeliver(this.value)"></div>
      <div class="rw" style="font-size:15px"><b id="pf_lb">${change>=0?'Tiền thừa trả khách':'⚠ KHÁCH CÒN NỢ'}</b>
        <b id="pf_val" class="num ${change>=0?'pos':'neg'}">${fmt(Math.abs(change))} đ</b></div>
      <button id="posPay" onclick="POS.pay()">💵 THANH TOÁN${t.items.length?` — ${fmt(total)} đ`:''}</button>`;
  },
  pay(){ const t=this.cur();
    if(!t.items.length){ toast('Giỏ hàng trống'); return; }
    this.setCust();
    let c=t.cid?cust(t.cid):null;
    if(!c&&t.cname){ c=touch({id:uid(),name:t.cname,phone:'',addr:'',note:''}); DB.customers.push(c); }
    const sub=t.items.reduce((s,i)=>s+i.qty*i.price,0), total=Math.max(0,sub-(t.discount||0));
    const cash=String(t.cash??'').trim()===''?total:(+String(t.cash).replace(/\D/g,'')||0);
    const paidAmt=Math.min(cash,total);
    DB.seq.hd++;
    const v=touch({id:uid(), code:DB.seq.hd, date:today(), cid:c?c.id:null, cname:c?c.name:'Khách lẻ',
      items:t.items.map(i=>({...i})), discount:t.discount||0, deliver:t.deliver||'',
      pays:paidAmt>0?[{date:today(),amt:paidAmt,method:t.method||'tm'}]:[], status:'done', note:''});
    v.items.forEach(i=>{const p=prod(i.pid); if(p){p.stock=Math.max(0,p.stock-i.qty);touch(p);}});
    DB.invoices.push(v); save();
    this.closeTab(this.active);
    const offline=SYNC.api&&!SYNC.localMode&&SYNC.status==='err';
    toast(`Đã lưu ${HD(v)}${paidAmt<total?' — khách nợ '+fmt(total-paidAmt)+' đ':''}${offline?' · ⚠ đang offline, sẽ đồng bộ khi có mạng':''}`);
    App.invView(v.id);
  },
};
$('#posQ').addEventListener('keydown',e=>{ if(e.key==='Enter'){
  const q=e.target.value.trim().toLowerCase();
  if(!q) return;
  const p=alive(DB.products).find(p=>(p.name+' '+p.size).toLowerCase().includes(q));
  if(p){ POS.add(p.id); e.target.value=''; POS.renderProds(); } }});

  setDeliver(id,val){ const v=DB.invoices.find(v=>v.id===id); if(!v)return;

  exportCRM(){ let csv='Ten khach,SDT,Email,Ma so thue,Dia chi,Ghi chu,Da mua (lan),Tong mua (d),Con no (d),Mua gan nhat,Loai khach\n';

      <div class="f3"><div><label>Tài khoản</label><input id="u_u" placeholder="vd: sale1"></div>
        <div><label>Mật khẩu</label><input id="u_p" placeholder="để trống = giữ cũ"></div>
        <div><label>Tên hiển thị</label><input id="u_n"></div></div>
      <div><label>Quyền</label><select id="u_r">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="hrow"><div class="grow"></div><button class="btn ghost" onclick="closeModal()">Đóng</button>
        <button class="btn" onclick="App.userSave()">💾 Lưu tài khoản</button></div></div>`);
    try{ const r=await SYNC.call('users_list');
      $('#uList').innerHTML=r.ok?`<div class="tbl"><table>${r.users.map(u=>
        `<tr><td><b>${esc(u.u)}</b></td><td>${esc(u.name||'')}</td><td>${ROLES[u.role]||u.role}</td>
        <td>${u.u!=='admin'?`<button class="btn danger sm" onclick="App.userDel('${esc(u.u)}')">🗑</button>`:''}</td></tr>`).join('')}</table></div>`
        :'Lỗi tải danh sách';
    }catch(e){ $('#uList').textContent='Không kết nối được máy chủ'; }
  },
  async userSave(){ const u=$('#u_u').value.trim(); if(!u){toast('Nhập tên tài khoản');return;}
    try{ const r=await SYNC.call('user_set',{u,p:$('#u_p').value,role:$('#u_r').value,name:$('#u_n').value.trim()||u});
      if(r.ok){toast('Đã lưu tài khoản '+u);this.usersUI();}else toast('Lỗi: '+(r.err==='need_password'?'tài khoản mới cần mật khẩu':r.err));
    }catch(e){toast('Không kết nối được máy chủ');} },
  async userDel(u){ if(!confirm('Xóa tài khoản '+u+'?'))return;
    try{ const r=await SYNC.call('user_del',{u}); if(r.ok){toast('Đã xóa');this.usersUI();} }catch(e){toast('Lỗi kết nối');} },
  backup(){ saveFile(`baobao-saoluu-${today()}.json`,JSON.stringify(DB),'application/json'); },
  restore(inp){ const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.products||!d.invoices)throw 0;
      DB=d;window.DB=DB;save();render();toast('Đã khôi phục!');}catch(e){toast('File không hợp lệ');}};
    rd.readAsText(f);inp.value=''; },
  reset(){ if(!confirm('Xóa TOÀN BỘ dữ liệu? Nên sao lưu trước!'))return;
    if(!confirm('Chắc chắn xóa?'))return;
    localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY);load();render();toast('Đã đặt lại app'); },
};

/* ================= RENDER ================= */
function render(){
  renderNav();
  if(!can(S.screen)) S.screen='home';
  const v={home:vHome,goods:vGoods,trans:vTrans,partners:vPartners,fund:vFund,staff:vStaff,reports:vReports,settings:vSettings}[S.screen]||vHome;
  const el=$('#view'); el.innerHTML=v(); attachTT(el);
}
window.go=go;window.App=App;window.POS=POS;window.S=S;window.$=$;window.SYNC=SYNC;
load();window.DB=DB;render();SYNC.init();
</script>
